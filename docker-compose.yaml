# nginx proxy address - http://172.17.0.1:64361

name: taiga
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  taiga-db:
    image: postgres:latest
    container_name: taiga-db
    hostname: taiga-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: taiga
      POSTGRES_USER: ${DB_USER_NAME:-taiga}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/taiga:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - taiga

  taiga-async-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taiga-async-rabbitmq
    hostname: taiga-async-rabbitmq
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      RABBITMQ_ERLANG_COOKIE: ${APP_RABBITMQ_COOKIE:-replace-with-a-random-cookie}
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: ${APP_RABBITMQ_PASS:-replace-with-a-random-password}
      RABBITMQ_DEFAULT_VHOST: taiga
    volumes:
      - './volumes/data/taiga/rabbitmq-async:/var/lib/rabbitmq:z'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - taiga

  taiga-events-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taiga-events-rabbitmq
    hostname: taiga-events-rabbitmq
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      RABBITMQ_ERLANG_COOKIE: ${APP_RABBITMQ_COOKIE:-replace-with-a-random-cookie}
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: ${APP_RABBITMQ_PASS:-replace-with-a-random-password}
      RABBITMQ_DEFAULT_VHOST: taiga
    volumes:
      - './volumes/data/taiga/rabbitmq-events:/var/lib/rabbitmq:z'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - taiga

  taiga-back:
    image: taigaio/taiga-back:latest
    container_name: taiga-back
    hostname: taiga-back
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: taiga
      POSTGRES_USER: ${DB_USER_NAME:-taiga}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      POSTGRES_HOST: taiga-db
      TAIGA_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-secret}
      TAIGA_SITES_SCHEME: ${TAIGA_SCHEME:-https}
      TAIGA_SITES_DOMAIN: ${BASE_HOST_NAME:-$HOSTNAME}
      TAIGA_SUBPATH: ''
      EMAIL_BACKEND: django.core.mail.backends.${EMAIL_BACKEND:-console}.EmailBackend
      DEFAULT_FROM_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      EMAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: ${APP_RABBITMQ_PASS:-replace-with-a-random-password}
      ENABLE_TELEMETRY: 'False'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/taiga/static:/taiga-back/static:z'
      - './volumes/data/taiga/media:/taiga-back/media:z'
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy
    networks:
      - taiga

  taiga-async:
    image: taigaio/taiga-back:latest
    container_name: taiga-async
    hostname: taiga-async
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: taiga
      POSTGRES_USER: ${DB_USER_NAME:-taiga}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      POSTGRES_HOST: taiga-db
      TAIGA_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-secret}
      TAIGA_SITES_SCHEME: ${TAIGA_SCHEME:-https}
      TAIGA_SITES_DOMAIN: ${BASE_HOST_NAME:-$HOSTNAME}
      TAIGA_SUBPATH: ''
      EMAIL_BACKEND: django.core.mail.backends.${EMAIL_BACKEND:-console}.EmailBackend
      DEFAULT_FROM_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      EMAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: ${APP_RABBITMQ_PASS:-replace-with-a-random-password}
      ENABLE_TELEMETRY: 'False'
    entrypoint: ['/taiga-back/docker/async_entrypoint.sh']
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/taiga/static:/taiga-back/static:z'
      - './volumes/data/taiga/media:/taiga-back/media:z'
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy
    networks:
      - taiga

  taiga-front:
    image: taigaio/taiga-front:latest
    container_name: taiga-front
    hostname: taiga-front
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      TAIGA_URL: ${TAIGA_SCHEME:-https}://${BASE_HOST_NAME:-$HOSTNAME}
      TAIGA_WEBSOCKETS_URL: ${WEBSOCKETS_SCHEME:-wss}://${BASE_HOST_NAME:-$HOSTNAME}
      TAIGA_SUBPATH: ''
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - taiga

  taiga-events:
    image: taigaio/taiga-events:latest
    container_name: taiga-events
    hostname: taiga-events
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: ${APP_RABBITMQ_PASS:-replace-with-a-random-password}
      TAIGA_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-secret}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8888']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      taiga-events-rabbitmq:
        condition: service_healthy
    networks:
      - taiga

  taiga-protected:
    image: taigaio/taiga-protected:latest
    container_name: taiga-protected
    hostname: taiga-protected
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      MAX_AGE: '360'
      SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-secret}
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8003']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - taiga

  taiga-gateway:
    image: nginx:alpine
    container_name: taiga-gateway
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: taiga-gateway
    ports:
      - '172.17.0.1:64361:80'
    configs:
      - source: taiga_gateway
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - './volumes/data/taiga/static:/taiga/static:ro,z'
      - './volumes/data/taiga/media:/taiga/media:ro,z'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '--spider', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events
    networks:
      - taiga

networks:
  taiga:
    name: taiga
    external: false

configs:
  taiga_gateway:
    content: |
      server {
          listen 80 default_server;

          client_max_body_size 100M;
          charset utf-8;

          # Frontend
          location / {
              proxy_pass http://taiga-front/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
          }

          # API
          location /api/ {
              proxy_pass http://taiga-back:8000/api/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
          }

          # Admin
          location /admin/ {
              proxy_pass http://taiga-back:8000/admin/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
          }

          # Static
          location /static/ {
              alias /taiga/static/;
          }

          # Media
          location /_protected/ {
              internal;
              alias /taiga/media/;
              add_header Content-disposition "attachment";
          }

          # Unprotected section
          location /media/exports/ {
              alias /taiga/media/exports/;
              add_header Content-disposition "attachment";
          }

          location /media/ {
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_pass http://taiga-protected:8003/;
              proxy_redirect off;
          }

          # Events
          location /events {
              proxy_pass http://taiga-events:8888/events;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_connect_timeout 7d;
              proxy_send_timeout 7d;
              proxy_read_timeout 7d;
          }
      }
